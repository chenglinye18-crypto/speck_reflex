[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speck-reflex"
version = "0.2.0"
description = "Robot Neuromorphic Reflex Arc Co-design Platform"
requires-python = ">=3.10"

[tool.setuptools]
packages = [
  "speck_reflex",
  "speck_reflex.official_baseline",
  "speck_reflex.protocol",
  "speck_reflex.robot",
  "speck_reflex.runtime",
  "software",
  "software.datasets",
  "software.event_processing",
  "software.models",
  "software.models.snn",
  "software.simulation",
  "software.training",
  "hardware",
  "hardware.interfaces",
]

[tool.setuptools.package-dir]
speck_reflex = "src/speck_reflex"
software = "software"
hardware = "hardware"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers"
markers = [
  "unit: isolated tests without network, GPU, or hardware",
  "integration: no-hardware software deployment-chain tests",
  "gpu: tests requiring CUDA",
  "hardware: opt-in physical-device tests",
  "slow: long-running tests or training",
]
